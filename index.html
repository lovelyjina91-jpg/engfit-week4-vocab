<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EngFit 영핏 · Week 4 단어 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Gaegu:wght@400;700&family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #2b2b3a;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffeef5 0%, #e0f2ff 35%, #f5e6ff 70%, #fff5e6 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    position: relative;
  }
  /* Floating blobs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 500px; height: 500px;
    background: linear-gradient(135deg, #ffafd6, #b9a7ff);
    top: -180px; left: -180px;
    animation: float1 12s ease-in-out infinite;
  }
  body::after {
    width: 600px; height: 600px;
    background: linear-gradient(135deg, #a6e3ff, #ffd3a3);
    bottom: -250px; right: -200px;
    animation: float2 14s ease-in-out infinite;
  }
  @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,60px)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-40px)} }

  .wrap {
    position: relative; z-index: 1;
    max-width: 760px; margin: 0 auto;
    padding: 24px 18px 60px;
  }

  /* Header */
  header.brand {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 22px;
    box-shadow: 0 8px 28px rgba(143,118,200,0.12);
    margin-bottom: 22px;
    border: 1px solid rgba(255,255,255,0.7);
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 22px;
    background: linear-gradient(135deg, #ff6bb5 0%, #6d8bff 50%, #b86bff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: -0.5px;
  }
  .logo .dot {
    width: 36px; height: 36px; border-radius: 12px;
    background: linear-gradient(135deg, #ff8fc8, #7b9bff);
    display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(255,107,181,0.35);
  }
  .logo .dot svg { width: 22px; height: 22px; }
  .logo small {
    display: block; font-size: 11px; font-weight: 600;
    color: #888; -webkit-text-fill-color: #888;
    letter-spacing: 0.5px; margin-top: -2px;
  }
  .pill {
    font-size: 12px; padding: 6px 12px; border-radius: 999px;
    background: linear-gradient(135deg, #fff0f7, #f0ecff);
    color: #6c5ce7; font-weight: 600;
    border: 1px solid rgba(108,92,231,0.15);
  }

  /* Cards */
  .card {
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 32px 26px;
    box-shadow: 0 18px 60px rgba(135,99,210,0.14), 0 2px 8px rgba(0,0,0,0.04);
    border: 1px solid rgba(255,255,255,0.7);
  }

  /* Start screen */
  .start-hero { text-align: center; padding: 14px 0 22px; }
  .start-hero .emoji { font-size: 56px; line-height: 1; }
  .start-hero h1 {
    font-size: 30px; font-weight: 800; margin-top: 10px;
    background: linear-gradient(135deg, #ff6bb5, #6d8bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: -0.8px;
  }
  .start-hero p { color: #6b7088; margin-top: 8px; font-size: 15px; }

  .opt-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 22px 0 8px; }
  .opt-row button.opt {
    padding: 16px 14px; border-radius: 18px;
    border: 2px solid transparent;
    background: rgba(255,255,255,0.7);
    font-family: inherit; font-weight: 700; font-size: 16px;
    color: #4a4a6a; cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px rgba(135,99,210,0.06);
  }
  .opt-row button.opt small {
    display: block; font-weight: 500; font-size: 12px; color: #8a8aa8; margin-top: 2px;
  }
  .opt-row button.opt.active {
    border-color: #ff8fc8;
    background: linear-gradient(135deg, #fff5fa, #f0f4ff);
    color: #c93b8e;
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(255,143,200,0.25);
  }
  .opt-row button.opt:hover { transform: translateY(-2px); }

  .btn-primary {
    display: block; width: 100%; padding: 18px;
    border: none; border-radius: 18px;
    background: linear-gradient(135deg, #ff6bb5 0%, #7b6bff 100%);
    color: white; font-family: inherit; font-weight: 700; font-size: 17px;
    cursor: pointer; margin-top: 18px;
    box-shadow: 0 12px 28px rgba(123,107,255,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    letter-spacing: -0.3px;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 32px rgba(123,107,255,0.45); }
  .btn-primary:active { transform: translateY(0); }
  .btn-ghost {
    display: block; width: 100%; padding: 14px;
    border: 2px solid #e6e0ff; border-radius: 16px;
    background: rgba(255,255,255,0.6);
    color: #6d5cc9; font-family: inherit; font-weight: 700; font-size: 15px;
    cursor: pointer; margin-top: 10px;
  }

  /* Quiz */
  .quiz-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .progress {
    flex: 1; height: 10px; background: rgba(255,255,255,0.7);
    border-radius: 999px; overflow: hidden; margin-right: 14px;
    border: 1px solid rgba(255,255,255,0.8);
  }
  .progress > div {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #ff8fc8, #7b9bff);
    border-radius: 999px;
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .counter { font-weight: 700; color: #6d5cc9; font-size: 14px; white-space: nowrap; }

  .qmeta {
    display: inline-block; padding: 5px 12px;
    border-radius: 999px; font-size: 12px; font-weight: 700;
    margin-bottom: 14px;
    letter-spacing: 0.3px;
  }
  .qmeta.en { background: linear-gradient(135deg, #e0f2ff, #f0ecff); color: #4a6fd1; }
  .qmeta.ko { background: linear-gradient(135deg, #fff0f7, #ffe9d6); color: #d16fa1; }

  .qword {
    font-size: 38px; font-weight: 800; line-height: 1.2;
    margin-bottom: 6px; letter-spacing: -1px;
    color: #2b2b3a;
    word-break: keep-all;
  }
  .qhint { color: #8a8aa8; font-size: 13px; margin-bottom: 22px; }

  .choices { display: grid; gap: 10px; }
  .choice {
    text-align: left; padding: 16px 18px; border-radius: 16px;
    border: 2px solid rgba(230, 224, 255, 0.6);
    background: rgba(255,255,255,0.7);
    font-family: inherit; font-size: 15px; font-weight: 600;
    color: #3a3a52; cursor: pointer;
    transition: all 0.15s ease;
    display: flex; align-items: center; gap: 12px;
    word-break: keep-all;
  }
  .choice .badge {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, #f0ecff, #fff0f7);
    color: #6d5cc9; font-weight: 800; font-size: 13px;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .choice:hover:not(:disabled) {
    transform: translateY(-2px);
    border-color: #b9a7ff;
    box-shadow: 0 6px 18px rgba(123,107,255,0.15);
  }
  .choice.correct {
    background: linear-gradient(135deg, #d4f7e0, #c5f0d0);
    border-color: #4dbd7f; color: #1d6e3f;
  }
  .choice.correct .badge { background: #4dbd7f; color: white; }
  .choice.wrong {
    background: linear-gradient(135deg, #ffe0e8, #ffd0d8);
    border-color: #e85a73; color: #a01c33;
  }
  .choice.wrong .badge { background: #e85a73; color: white; }
  .choice:disabled { cursor: default; }

  .feedback {
    margin-top: 16px; padding: 14px 16px; border-radius: 14px;
    font-size: 14px; font-weight: 600;
    display: none;
  }
  .feedback.show { display: block; animation: slideIn 0.3s ease; }
  .feedback.ok { background: linear-gradient(135deg, #e8fbef, #d6f6e0); color: #1d6e3f; }
  .feedback.no { background: linear-gradient(135deg, #fff0f3, #ffe0e8); color: #a01c33; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Result */
  .result-hero { text-align: center; padding: 8px 0 18px; }
  .result-hero .big-emoji { font-size: 64px; }
  .result-hero h2 {
    font-size: 26px; margin-top: 8px; letter-spacing: -0.6px;
    background: linear-gradient(135deg, #ff6bb5, #6d8bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .result-score {
    margin: 14px auto 8px;
    font-size: 56px; font-weight: 800;
    background: linear-gradient(135deg, #ff8fc8, #7b9bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .result-sub { color: #6b7088; font-weight: 600; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0; }
  .stat {
    background: rgba(255,255,255,0.65);
    padding: 14px 10px; border-radius: 16px; text-align: center;
    border: 1px solid rgba(255,255,255,0.8);
  }
  .stat .num { font-size: 22px; font-weight: 800; color: #4a4a6a; }
  .stat .lbl { font-size: 11px; color: #8a8aa8; font-weight: 600; margin-top: 2px; letter-spacing: 0.3px; }
  .stat.ok .num { color: #4dbd7f; }
  .stat.no .num { color: #e85a73; }

  .wrong-section h3 {
    font-size: 15px; font-weight: 700; color: #4a4a6a; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .wrong-list {
    background: rgba(255,255,255,0.6);
    border: 1px dashed #e0d5ff;
    border-radius: 16px; padding: 14px;
    max-height: 280px; overflow-y: auto;
    font-size: 14px;
  }
  .wrong-list .item {
    padding: 8px 0; border-bottom: 1px solid rgba(108,92,231,0.08);
  }
  .wrong-list .item:last-child { border-bottom: none; }
  .wrong-list .en { font-weight: 700; color: #2b2b3a; }
  .wrong-list .ko { color: #6b7088; font-weight: 500; }
  .wrong-list .mine { color: #e85a73; font-size: 12px; margin-top: 2px; }

  .perfect {
    background: linear-gradient(135deg, #fff8dc, #ffe9d6);
    padding: 18px; border-radius: 16px;
    text-align: center; font-weight: 700; color: #b87a2b;
  }

  .copy-btn {
    margin-top: 12px; width: 100%; padding: 16px;
    background: linear-gradient(135deg, #ffe600 0%, #ffd400 100%);
    border: none; border-radius: 16px;
    color: #3a1d00; font-family: inherit; font-weight: 800; font-size: 15px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(255,200,0,0.4);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 0.15s ease;
  }
  .copy-btn:hover { transform: translateY(-2px); }
  .copy-btn.copied {
    background: linear-gradient(135deg, #b3f5c5, #8be8a3);
    color: #1d6e3f;
  }
  .kakao-icon { width: 22px; height: 22px; }

  .restart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .restart-row button {
    padding: 14px; border-radius: 14px;
    font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
    border: 2px solid #e6e0ff; background: rgba(255,255,255,0.6); color: #6d5cc9;
  }
  .restart-row button.primary {
    background: linear-gradient(135deg, #ff6bb5, #7b6bff);
    color: white; border-color: transparent;
    box-shadow: 0 8px 18px rgba(123,107,255,0.3);
  }

  footer.foot {
    text-align: center; color: #8a8aa8;
    font-size: 12px; margin-top: 24px;
  }
  footer.foot b { color: #6d5cc9; }

  @media (max-width: 480px) {
    .qword { font-size: 30px; }
    .start-hero h1 { font-size: 24px; }
    .result-score { font-size: 44px; }
    .card { padding: 24px 20px; border-radius: 22px; }
    .logo { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="brand">
    <div class="logo">
      <div class="dot">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div>
        EngFit 영핏
        <small>WEEK 4 · VOCAB TEST</small>
      </div>
    </div>
    <span class="pill">지나 티처 ✿</span>
  </header>

  <!-- START SCREEN -->
  <section id="start" class="card">
    <div class="start-hero">
      <div class="emoji">📚✨</div>
      <h1>오늘의 단어 테스트</h1>
      <p>문항 수를 골라 시작해 보세요. 영↔한 섞어서 출제돼요.</p>
    </div>
    <div class="opt-row" id="optRow">
      <button class="opt" data-count="10">10문항<small>워밍업</small></button>
      <button class="opt active" data-count="20">20문항<small>기본</small></button>
      <button class="opt" data-count="30">30문항<small>도전</small></button>
      <button class="opt" data-count="all">전체<small>마스터</small></button>
    </div>
    <button class="btn-primary" id="startBtn">시작하기 →</button>
    <button class="btn-ghost" id="lookupBtn">단어장 보기 📖</button>
  </section>

  <!-- LOOKUP SCREEN -->
  <section id="lookup" class="card" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="font-size:20px;color:#4a4a6a">📖 단어장</h2>
      <button class="pill" id="backFromLookup" style="cursor:pointer;border:none">← 돌아가기</button>
    </div>
    <input id="searchBox" placeholder="🔍 영어/한글 검색..." style="width:100%;padding:14px 16px;border-radius:14px;border:2px solid #e6e0ff;background:rgba(255,255,255,0.7);font-family:inherit;font-size:15px;margin-bottom:14px;outline:none">
    <div id="vocabList" style="max-height:60vh;overflow-y:auto;padding-right:6px"></div>
  </section>

  <!-- QUIZ SCREEN -->
  <section id="quiz" class="card" style="display:none">
    <div class="quiz-top">
      <div class="progress"><div id="bar"></div></div>
      <div class="counter" id="counter">1 / 20</div>
    </div>
    <div class="qmeta" id="qmeta">영어 → 한국어</div>
    <div class="qword" id="qword">word</div>
    <div class="qhint" id="qhint">다음 단어의 뜻으로 알맞은 것은?</div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn-primary" id="nextBtn" style="display:none">다음 →</button>
  </section>

  <!-- RESULT SCREEN -->
  <section id="result" class="card" style="display:none">
    <div class="result-hero">
      <div class="big-emoji" id="rEmoji">🎉</div>
      <h2 id="rTitle">테스트 완료!</h2>
      <div class="result-score"><span id="rScore">0</span>점</div>
      <div class="result-sub" id="rSub">잘 했어요!</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" id="sTotal">0</div><div class="lbl">전체</div></div>
      <div class="stat ok"><div class="num" id="sOk">0</div><div class="lbl">맞음</div></div>
      <div class="stat no"><div class="num" id="sNo">0</div><div class="lbl">틀림</div></div>
    </div>
    <div class="wrong-section">
      <h3>📝 틀린 단어</h3>
      <div id="wrongBox"></div>
      <button class="copy-btn" id="copyBtn">
        <svg class="kakao-icon" viewBox="0 0 24 24" fill="#3a1d00"><path d="M12 3C6.5 3 2 6.5 2 10.7c0 2.7 1.8 5 4.5 6.3L5.4 21l4.3-2.5c.7.1 1.5.2 2.3.2 5.5 0 10-3.5 10-7.7S17.5 3 12 3z"/></svg>
        지나 티처에게 보낼 메시지 복사하기
      </button>
    </div>
    <div class="restart-row">
      <button id="reviewBtn">틀린 단어 다시</button>
      <button class="primary" id="restartBtn">처음으로</button>
    </div>
  </section>

  <footer class="foot">
    Made with 💜 by <b>EngFit 영핏</b> · 지나 티처
  </footer>
</div>

<script>
/* ============ VOCAB DATA (Week 4) ============ */
const VOCAB = [

/* ============ HELPERS ============ */
const shuffle = (a) => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (arr, n, exclude) => {
  const pool = arr.filter(x => x !== exclude);
  return shuffle([...pool]).slice(0, n);
};

/* ============ STATE ============ */
let state = {
  questions: [],
  current: 0,
  wrong: [],
  answered: false,
};
let selectedCount = 20;

/* ============ BUILDERS ============ */
function buildQuestions(count) {
  const pool = shuffle([...VOCAB]).slice(0, count === 'all' ? VOCAB.length : count);
  return pool.map(([en, ko], i) => {
    const direction = Math.random() < 0.5 ? 'en2ko' : 'ko2en';
    const distractors = sample(VOCAB, 3, [en, ko])
      .map(([e, k]) => direction === 'en2ko' ? k : e);
    const correct = direction === 'en2ko' ? ko : en;
    const choices = shuffle([correct, ...distractors]);
    return {
      direction,
      en, ko,
      prompt: direction === 'en2ko' ? en : ko,
      correct,
      choices,
    };
  });
}

/* ============ RENDER ============ */
const $ = (id) => document.getElementById(id);

function show(screen) {
  ['start','quiz','result','lookup'].forEach(s => $(s).style.display = s === screen ? '' : 'none');
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion() {
  const q = state.questions[state.current];
  $('counter').textContent = `${state.current+1} / ${state.questions.length}`;
  $('bar').style.width = `${(state.current/state.questions.length)*100}%`;
  $('qmeta').textContent = q.direction === 'en2ko' ? '영어 → 한국어' : '한국어 → 영어';
  $('qmeta').className = 'qmeta ' + (q.direction === 'en2ko' ? 'en' : 'ko');
  $('qword').textContent = q.prompt;
  $('qhint').textContent = q.direction === 'en2ko' ? '다음 영어 단어의 뜻으로 알맞은 것은?' : '다음 뜻에 해당하는 영어 단어는?';
  const choicesEl = $('choices');
  choicesEl.innerHTML = '';
  const labels = ['①','②','③','④'];
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `<span class="badge">${labels[i]}</span><span>${c}</span>`;
    btn.onclick = () => handleAnswer(btn, c, q);
    choicesEl.appendChild(btn);
  });
  $('feedback').className = 'feedback';
  $('feedback').textContent = '';
  $('nextBtn').style.display = 'none';
  state.answered = false;
}

function handleAnswer(btn, choice, q) {
  if (state.answered) return;
  state.answered = true;
  const isCorrect = choice === q.correct;
  const allBtns = $('choices').querySelectorAll('.choice');
  allBtns.forEach(b => {
    b.disabled = true;
    const txt = b.querySelector('span:last-child').textContent;
    if (txt === q.correct) b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
  });
  const fb = $('feedback');
  if (isCorrect) {
    fb.className = 'feedback show ok';
    fb.textContent = '✨ 정답이에요!';
  } else {
    fb.className = 'feedback show no';
    fb.textContent = `❌ 정답: ${q.correct}`;
    state.wrong.push({ ...q, mine: choice });
  }
  $('nextBtn').style.display = 'block';
  $('nextBtn').textContent = state.current === state.questions.length - 1 ? '결과 보기 →' : '다음 →';
}

function nextQuestion() {
  state.current++;
  if (state.current >= state.questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  const total = state.questions.length;
  const ok = total - state.wrong.length;
  const pct = Math.round((ok/total)*100);
  $('rScore').textContent = pct;
  $('sTotal').textContent = total;
  $('sOk').textContent = ok;
  $('sNo').textContent = state.wrong.length;

  let emoji = '🎉', title = '완벽해요!', sub = '모든 단어를 맞혔어요!';
  if (pct < 100 && pct >= 80) { emoji = '🌟'; title = '잘 했어요!'; sub = '거의 다 맞혔어요!'; }
  else if (pct >= 60) { emoji = '💪'; title = '괜찮아요!'; sub = '조금만 더 복습해 봐요!'; }
  else if (pct >= 40) { emoji = '📖'; title = '복습이 필요해요'; sub = '틀린 단어 꼭 보고 가요!'; }
  else { emoji = '🌱'; title = '다시 도전!'; sub = '단어장을 보며 천천히 익혀봐요!'; }
  $('rEmoji').textContent = emoji;
  $('rTitle').textContent = title;
  $('rSub').textContent = sub;

  const wrongBox = $('wrongBox');
  if (state.wrong.length === 0) {
    wrongBox.innerHTML = '<div class="perfect">🏆 100점! 틀린 단어가 없어요!</div>';
    $('copyBtn').style.display = 'none';
  } else {
    let html = '<div class="wrong-list">';
    state.wrong.forEach(w => {
      html += `<div class="item">
        <span class="en">${w.en}</span> <span class="ko">— ${w.ko}</span>
        <div class="mine">내 답: ${w.mine}</div>
      </div>`;
    });
    html += '</div>';
    wrongBox.innerHTML = html;
    $('copyBtn').style.display = '';
  }
  show('result');
}

function buildKakaoMessage() {
  const date = new Date();
  const y = date.getFullYear(), m = date.getMonth()+1, d = date.getDate();
  let msg = `📚 EngFit 영핏 단어 테스트 결과\n`;
  msg += `📅 ${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}\n`;
  msg += `\n✅ ${state.questions.length}문항 중 ${state.questions.length - state.wrong.length}개 정답`;
  msg += ` (${Math.round(((state.questions.length-state.wrong.length)/state.questions.length)*100)}점)\n`;
  if (state.wrong.length > 0) {
    msg += `\n❌ 틀린 단어 (${state.wrong.length}개)\n`;
    msg += `―――――――――――\n`;
    state.wrong.forEach((w,i) => {
      msg += `${i+1}. ${w.en} → ${w.ko}\n   (내 답: ${w.mine})\n`;
    });
  } else {
    msg += `\n🏆 모두 정답! 완벽해요!`;
  }
  msg += `\n지나티처 ✿`;
  return msg;
}

function copyKakao() {
  const msg = buildKakaoMessage();
  const btn = $('copyBtn');
  navigator.clipboard.writeText(msg).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '✅ 복사 완료! 카카오톡에 붙여넣기 하세요';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg class="kakao-icon" viewBox="0 0 24 24" fill="#3a1d00"><path d="M12 3C6.5 3 2 6.5 2 10.7c0 2.7 1.8 5 4.5 6.3L5.4 21l4.3-2.5c.7.1 1.5.2 2.3.2 5.5 0 10-3.5 10-7.7S17.5 3 12 3z"/></svg> 지나 티처에게 보낼 메시지 복사하기`;
    }, 2400);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = msg; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    btn.classList.add('copied');
    btn.innerHTML = '✅ 복사 완료!';
  });
}

function renderVocabList(filter = '') {
  const f = filter.trim().toLowerCase();
  const list = VOCAB.filter(([en, ko]) =>
    !f || en.toLowerCase().includes(f) || ko.toLowerCase().includes(f)
  );
  const el = $('vocabList');
  if (list.length === 0) {
    el.innerHTML = '<div style="text-align:center;color:#8a8aa8;padding:30px">검색 결과가 없어요</div>';
    return;
  }
  el.innerHTML = list.map(([en, ko]) => `
    <div style="padding:12px 14px;border-radius:12px;margin-bottom:6px;background:rgba(255,255,255,0.7);display:flex;justify-content:space-between;align-items:center;gap:12px;">
      <span style="font-weight:700;color:#2b2b3a">${en}</span>
      <span style="color:#6b7088;font-size:14px;text-align:right">${ko}</span>
    </div>
  `).join('');
}

/* ============ EVENTS ============ */
document.querySelectorAll('#optRow .opt').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#optRow .opt').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const c = b.dataset.count;
    selectedCount = c === 'all' ? 'all' : parseInt(c);
  };
});
$('startBtn').onclick = () => {
  state.questions = buildQuestions(selectedCount);
  state.current = 0;
  state.wrong = [];
  show('quiz');
  renderQuestion();
};
$('nextBtn').onclick = nextQuestion;
$('copyBtn').onclick = copyKakao;
$('restartBtn').onclick = () => show('start');
$('reviewBtn').onclick = () => {
  if (state.wrong.length === 0) { show('start'); return; }
  // build a new test from only wrong words
  const wrongVocab = state.wrong.map(w => [w.en, w.ko]);
  const newPool = shuffle([...wrongVocab]);
  state.questions = newPool.map(([en, ko]) => {
    const direction = Math.random() < 0.5 ? 'en2ko' : 'ko2en';
    const distractors = sample(VOCAB, 3, [en, ko])
      .map(([e, k]) => direction === 'en2ko' ? k : e);
    const correct = direction === 'en2ko' ? ko : en;
    return {
      direction, en, ko,
      prompt: direction === 'en2ko' ? en : ko,
      correct,
      choices: shuffle([correct, ...distractors])
    };
  });
  state.current = 0;
  state.wrong = [];
  show('quiz');
  renderQuestion();
};
$('lookupBtn').onclick = () => { renderVocabList(); show('lookup'); };
$('backFromLookup').onclick = () => show('start');
$('searchBox').oninput = (e) => renderVocabList(e.target.value);

/* boot */
show('start');
</script>
</body>
</html>
