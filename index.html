<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EngFit 영핏 · Week 4 단어 테스트 🍋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;0,800;0,900;1,700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  button { touch-action: manipulation; }
  :root {
    --lemon: #FFD93D;
    --lemon-deep: #F6BE00;
    --lemon-soft: #FFF1A8;
    --cream: #FFFBEA;
    --ink: #2b2b2b;
    --ink-soft: #6b6450;
    --leaf: #6FB04A;
  }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: var(--cream);
    overflow-x: hidden;
    position: relative;
  }

  /* === Lemon background pattern === */
  .bg-svg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
    opacity: 0.55;
  }
  /* Soft yellow gradient overlay for readability */
  .bg-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at top, rgba(255,251,234,0.4) 0%, rgba(255,251,234,0.85) 100%);
  }

  .wrap {
    position: relative; z-index: 1;
    max-width: 760px; margin: 0 auto;
    padding: 24px 18px 60px;
  }

  /* === Header / brand === */
  header.brand {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: white;
    border-radius: 22px;
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    margin-bottom: 22px;
  }
  .logo {
    display: flex; align-items: center; gap: 12px;
  }
  .logo .lemon-mark {
    width: 44px; height: 44px;
    position: relative;
    flex-shrink: 0;
  }
  .logo .lemon-mark svg { width: 100%; height: 100%; }
  .logo-text {
    font-family: 'Fraunces', serif;
    font-weight: 900; font-size: 22px;
    color: var(--ink);
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .logo-text small {
    display: block;
    font-family: 'Caveat', cursive;
    font-size: 14px; font-weight: 700;
    color: var(--lemon-deep);
    margin-top: 2px; letter-spacing: 0.3px;
  }
  .pill {
    font-family: 'Caveat', cursive;
    font-size: 18px; padding: 6px 14px; border-radius: 999px;
    background: var(--lemon);
    color: var(--ink); font-weight: 700;
    border: 2.5px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
  }

  /* === Cards (notebook style) === */
  .card {
    background: white;
    border: 3px solid var(--ink);
    border-radius: 26px;
    padding: 32px 26px;
    box-shadow: 6px 6px 0 var(--ink);
    position: relative;
  }
  /* Notebook ring punches at top */
  .card.notebook::before {
    content: '';
    position: absolute;
    top: -3px; left: 30px; right: 30px;
    height: 14px;
    background-image: radial-gradient(circle, var(--cream) 5px, transparent 6px);
    background-size: 28px 14px;
    background-repeat: repeat-x;
    background-position: center;
  }

  /* === Start screen === */
  .notebook-badge {
    display: inline-block; padding: 8px 22px;
    background: var(--lemon);
    border: 3px solid var(--ink);
    border-radius: 999px;
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 16px; letter-spacing: 3px;
    margin: 0 auto 20px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .start-hero { text-align: center; padding: 18px 0 22px; }
  .start-hero .lemon-big {
    font-size: 64px; line-height: 1;
    display: inline-block;
    animation: wobble 3s ease-in-out infinite;
  }
  @keyframes wobble { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
  .start-hero h1 {
    font-family: 'Fraunces', serif;
    font-size: 34px; font-weight: 900;
    margin-top: 6px;
    color: var(--ink);
    letter-spacing: -1px;
  }
  .start-hero h1 .underline-wave {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 10' preserveAspectRatio='none'><path d='M0,7 Q25,0 50,5 T100,5' stroke='%23FFD93D' stroke-width='6' fill='none'/></svg>");
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: 100% 10px;
    padding-bottom: 4px;
  }
  .start-hero p {
    color: var(--ink-soft); margin-top: 12px;
    font-family: 'Caveat', cursive;
    font-size: 19px; font-weight: 500;
  }

  .opt-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 24px 0 8px; }
  .opt-row button.opt {
    padding: 16px 12px;
    border: 3px solid var(--ink);
    border-radius: 18px;
    background: white;
    font-family: 'Fraunces', serif;
    font-weight: 800; font-size: 17px;
    color: var(--ink); cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .opt-row button.opt small {
    display: block;
    font-family: 'Caveat', cursive;
    font-weight: 700; font-size: 14px;
    color: var(--ink-soft); margin-top: 2px;
  }
  .opt-row button.opt:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  .opt-row button.opt.active {
    background: var(--lemon);
    transform: translate(1px,1px);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .opt-row button.opt.active small { color: var(--ink); }

  .btn-primary {
    display: block; width: 100%; padding: 18px;
    border: 3px solid var(--ink);
    border-radius: 18px;
    background: var(--lemon);
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 900; font-size: 19px;
    cursor: pointer; margin-top: 18px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    letter-spacing: -0.3px;
  }
  .btn-primary:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .btn-primary:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .btn-ghost {
    display: block; width: 100%; padding: 14px;
    border: 3px solid var(--ink); border-radius: 16px;
    background: white;
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 700; font-size: 16px;
    cursor: pointer; margin-top: 10px;
    box-shadow: 3px 3px 0 var(--ink);
    transition: all 0.12s ease;
  }
  .btn-ghost:hover { background: var(--lemon-soft); transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }

  /* === Quiz === */
  .quiz-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .progress {
    flex: 1; height: 14px; background: white;
    border: 3px solid var(--ink);
    border-radius: 999px; overflow: hidden; margin-right: 14px;
  }
  .progress > div {
    height: 100%; width: 0;
    background: var(--lemon);
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .counter {
    font-family: 'Fraunces', serif;
    font-weight: 900; color: var(--ink);
    font-size: 16px; white-space: nowrap;
    background: var(--lemon);
    padding: 4px 12px;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    box-shadow: 2px 2px 0 var(--ink);
  }

  .qmeta {
    display: inline-block; padding: 5px 14px;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    font-family: 'Fraunces', serif;
    font-size: 13px; font-weight: 800;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .qmeta.en { background: #FFE25B; color: var(--ink); }
  .qmeta.ko { background: #FFF1A8; color: var(--ink); }

  .qword {
    font-family: 'Fraunces', serif;
    font-size: 42px; font-weight: 900; line-height: 1.15;
    margin-bottom: 8px; letter-spacing: -1.2px;
    color: var(--ink);
    word-break: keep-all;
  }
  .qhint {
    color: var(--ink-soft);
    font-family: 'Caveat', cursive;
    font-size: 18px; font-weight: 600;
    margin-bottom: 22px;
  }

  .choices { display: grid; gap: 12px; }
  .choice {
    text-align: left; padding: 16px 18px;
    border: 3px solid var(--ink);
    border-radius: 16px;
    background: white;
    font-family: 'Pretendard', sans-serif;
    font-size: 16px; font-weight: 700;
    color: var(--ink); cursor: pointer;
    transition: all 0.12s ease;
    display: flex; align-items: center; gap: 12px;
    word-break: keep-all;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .choice .badge {
    width: 30px; height: 30px; border-radius: 999px;
    background: var(--lemon);
    border: 2.5px solid var(--ink);
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 900; font-size: 14px;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .choice:hover:not(:disabled) {
    transform: translate(-1px,-1px);
    box-shadow: 4px 4px 0 var(--ink);
    background: var(--lemon-soft);
  }
  .choice.correct {
    background: #C7EFB0;
    border-color: var(--ink);
  }
  .choice.correct .badge { background: var(--leaf); color: white; }
  .choice.wrong {
    background: #FFC7C7;
    border-color: var(--ink);
  }
  .choice.wrong .badge { background: #E85A5A; color: white; }
  .choice:disabled { cursor: default; }

  .feedback {
    margin-top: 16px; padding: 14px 16px;
    border: 3px solid var(--ink);
    border-radius: 14px;
    font-family: 'Fraunces', serif;
    font-size: 16px; font-weight: 800;
    display: none;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .feedback.show { display: block; animation: pop 0.3s ease; }
  .feedback.ok { background: #C7EFB0; color: #2d5a16; }
  .feedback.no { background: #FFC7C7; color: #8a1a1a; }
  @keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }

  /* === Result === */
  .result-hero { text-align: center; padding: 8px 0 18px; }
  .result-hero .big-emoji {
    font-size: 72px;
    animation: wobble 2.5s ease-in-out infinite;
    display: inline-block;
  }
  .result-hero h2 {
    font-family: 'Fraunces', serif;
    font-size: 30px; font-weight: 900;
    margin-top: 8px; letter-spacing: -0.8px;
    color: var(--ink);
  }
  .result-score {
    margin: 18px auto 8px;
    font-family: 'Fraunces', serif;
    font-size: 76px; font-weight: 900;
    color: var(--ink);
    line-height: 1;
    display: inline-block;
    position: relative;
  }
  .result-score::after {
    content: '';
    position: absolute; left: -8px; right: -8px;
    bottom: 4px; height: 16px;
    background: var(--lemon);
    z-index: -1;
    border-radius: 8px;
  }
  .result-sub {
    color: var(--ink-soft);
    font-family: 'Caveat', cursive;
    font-size: 20px; font-weight: 700;
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 26px 0; }
  .stat {
    background: white;
    padding: 14px 8px; border-radius: 16px; text-align: center;
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
  }
  .stat .num {
    font-family: 'Fraunces', serif;
    font-size: 26px; font-weight: 900;
    color: var(--ink);
  }
  .stat .lbl {
    font-family: 'Caveat', cursive;
    font-size: 16px; font-weight: 700;
    color: var(--ink-soft); margin-top: 2px;
  }
  .stat.ok { background: #C7EFB0; }
  .stat.no { background: #FFC7C7; }

  .wrong-section h3 {
    font-family: 'Fraunces', serif;
    font-size: 18px; font-weight: 800;
    color: var(--ink); margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .wrong-list {
    background: var(--cream);
    border: 3px dashed var(--ink);
    border-radius: 16px; padding: 14px;
    max-height: 280px; overflow-y: auto;
    font-size: 15px;
  }
  .wrong-list .item {
    padding: 10px 0; border-bottom: 2px dashed rgba(0,0,0,0.12);
  }
  .wrong-list .item:last-child { border-bottom: none; }
  .wrong-list .en {
    font-family: 'Fraunces', serif;
    font-weight: 800; color: var(--ink);
  }
  .wrong-list .ko { color: var(--ink-soft); font-weight: 500; }
  .wrong-list .mine {
    color: #c44747;
    font-family: 'Caveat', cursive;
    font-size: 15px; font-weight: 700; margin-top: 2px;
  }

  .perfect {
    background: var(--lemon);
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 20px; border-radius: 16px;
    text-align: center;
    font-family: 'Fraunces', serif;
    font-weight: 900; color: var(--ink);
    font-size: 17px;
  }

  .copy-btn {
    margin-top: 14px; width: 100%; padding: 16px;
    background: #FAE100;
    border: 3px solid var(--ink);
    border-radius: 16px;
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 900; font-size: 16px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.12s ease;
  }
  .copy-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .copy-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .copy-btn.copied { background: #C7EFB0; }
  .kakao-icon { width: 22px; height: 22px; }

  .restart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .restart-row button {
    padding: 14px;
    border: 3px solid var(--ink);
    border-radius: 14px;
    font-family: 'Fraunces', serif;
    font-weight: 800; font-size: 15px; cursor: pointer;
    background: white; color: var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    transition: all 0.12s ease;
  }
  .restart-row button:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  .restart-row button.primary {
    background: var(--lemon);
  }

  footer.foot {
    text-align: center;
    color: var(--ink-soft);
    font-family: 'Caveat', cursive;
    font-size: 17px; font-weight: 700;
    margin-top: 24px;
  }
  footer.foot b { color: var(--ink); }

  /* === Lookup === */
  #searchBox {
    width: 100%; padding: 14px 16px;
    border-radius: 14px;
    border: 3px solid var(--ink);
    background: white;
    font-family: inherit; font-size: 15px;
    margin-bottom: 14px; outline: none;
    box-shadow: 3px 3px 0 var(--ink);
    font-weight: 600;
  }
  #searchBox:focus { background: var(--cream); }
  .vocab-item {
    padding: 12px 14px; border-radius: 12px;
    margin-bottom: 8px;
    background: white;
    border: 2.5px solid var(--ink);
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .vocab-item .v-en {
    font-family: 'Fraunces', serif;
    font-weight: 800; color: var(--ink);
  }
  .vocab-item .v-ko {
    color: var(--ink-soft); font-size: 14px; text-align: right;
    font-weight: 500;
  }

  @media (max-width: 480px) {
    .qword { font-size: 32px; }
    .start-hero h1 { font-size: 26px; }
    .result-score { font-size: 56px; }
    .card { padding: 26px 20px; border-radius: 22px; }
    .logo-text { font-size: 18px; }
    .logo .lemon-mark { width: 38px; height: 38px; }
  }
</style>
</head>
<body>
<svg class="bg-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <pattern id="lemonPattern" x="0" y="0" width="360" height="360" patternUnits="userSpaceOnUse">
      <rect width="360" height="360" fill="#FFFBEA"/>
      <g transform="translate(60,70) rotate(-15)">
        <circle cx="0" cy="0" r="55" fill="#FFEB7A" stroke="#F6BE00" stroke-width="3"/>
        <circle cx="0" cy="0" r="42" fill="#FFF5C2" stroke="#F6BE00" stroke-width="2"/>
        <g stroke="#F6BE00" stroke-width="2" fill="none">
          <line x1="0" y1="-40" x2="0" y2="40"/>
          <line x1="-40" y1="0" x2="40" y2="0"/>
          <line x1="-28" y1="-28" x2="28" y2="28"/>
          <line x1="-28" y1="28" x2="28" y2="-28"/>
        </g>
        <ellipse cx="15" cy="-15" rx="5" ry="10" fill="#FFD93D" transform="rotate(45 15 -15)"/>
        <ellipse cx="-15" cy="-15" rx="5" ry="10" fill="#FFD93D" transform="rotate(-45 -15 -15)"/>
        <ellipse cx="15" cy="15" rx="5" ry="10" fill="#FFD93D" transform="rotate(-45 15 15)"/>
        <ellipse cx="-15" cy="15" rx="5" ry="10" fill="#FFD93D" transform="rotate(45 -15 15)"/>
      </g>
      <g transform="translate(310,40) rotate(25)">
        <circle cx="0" cy="0" r="48" fill="#FFE25B" stroke="#F6BE00" stroke-width="3"/>
        <circle cx="0" cy="0" r="36" fill="#FFF5C2" stroke="#F6BE00" stroke-width="2"/>
        <g stroke="#F6BE00" stroke-width="2" fill="none">
          <line x1="0" y1="-34" x2="0" y2="34"/>
          <line x1="-34" y1="0" x2="34" y2="0"/>
          <line x1="-24" y1="-24" x2="24" y2="24"/>
          <line x1="-24" y1="24" x2="24" y2="-24"/>
        </g>
      </g>
      <g transform="translate(190,180) rotate(20)">
        <ellipse cx="0" cy="0" rx="48" ry="38" fill="#FFD93D" stroke="#E5A800" stroke-width="3"/>
        <ellipse cx="-22" cy="-12" rx="10" ry="5" fill="#FFF5C2" opacity="0.7"/>
        <path d="M -48 0 Q -55 -5 -58 -2" stroke="#E5A800" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M 48 0 Q 55 -5 58 -2" stroke="#E5A800" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M 40 -25 Q 50 -38 65 -30" stroke="#6FB04A" stroke-width="3" fill="#80C055" stroke-linejoin="round"/>
      </g>
      <g transform="translate(50,280) rotate(35)">
        <circle cx="0" cy="0" r="50" fill="#FFEB7A" stroke="#F6BE00" stroke-width="3"/>
        <circle cx="0" cy="0" r="38" fill="#FFF5C2" stroke="#F6BE00" stroke-width="2"/>
        <g stroke="#F6BE00" stroke-width="2" fill="none">
          <line x1="0" y1="-36" x2="0" y2="36"/>
          <line x1="-36" y1="0" x2="36" y2="0"/>
          <line x1="-25" y1="-25" x2="25" y2="25"/>
          <line x1="-25" y1="25" x2="25" y2="-25"/>
        </g>
        <ellipse cx="14" cy="-14" rx="5" ry="9" fill="#FFD93D" transform="rotate(45 14 -14)"/>
        <ellipse cx="-14" cy="-14" rx="5" ry="9" fill="#FFD93D" transform="rotate(-45 -14 -14)"/>
      </g>
      <g transform="translate(310,310) rotate(-10)">
        <circle cx="0" cy="0" r="52" fill="#FFE25B" stroke="#F6BE00" stroke-width="3"/>
        <circle cx="0" cy="0" r="40" fill="#FFF5C2" stroke="#F6BE00" stroke-width="2"/>
        <g stroke="#F6BE00" stroke-width="2" fill="none">
          <line x1="0" y1="-38" x2="0" y2="38"/>
          <line x1="-38" y1="0" x2="38" y2="0"/>
          <line x1="-27" y1="-27" x2="27" y2="27"/>
          <line x1="-27" y1="27" x2="27" y2="-27"/>
        </g>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#lemonPattern)"/>
</svg>
<div class="bg-overlay"></div>
<div class="wrap">

  <header class="brand">
    <div class="logo">
      <div class="lemon-mark">
        <svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
          <circle cx="25" cy="25" r="22" fill="#FFEB7A" stroke="#2b2b2b" stroke-width="2.5"/>
          <circle cx="25" cy="25" r="16" fill="#FFF5C2" stroke="#2b2b2b" stroke-width="2"/>
          <g stroke="#2b2b2b" stroke-width="1.8" fill="none">
            <line x1="25" y1="10" x2="25" y2="40"/>
            <line x1="10" y1="25" x2="40" y2="25"/>
            <line x1="14" y1="14" x2="36" y2="36"/>
            <line x1="14" y1="36" x2="36" y2="14"/>

const shuffle = (a) => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (arr, n, exclude) => {
  const pool = arr.filter(x => x !== exclude);
  return shuffle([...pool]).slice(0, n);
};

let state = { questions: [], current: 0, wrong: [], answered: false };
let selectedCount = 20;

function buildQuestions(count) {
  const pool = shuffle([...VOCAB]).slice(0, count === 'all' ? VOCAB.length : count);
  return pool.map(([en, ko]) => {
    const direction = Math.random() < 0.5 ? 'en2ko' : 'ko2en';
    const distractors = sample(VOCAB, 3, [en, ko])
      .map(([e, k]) => direction === 'en2ko' ? k : e);
    const correct = direction === 'en2ko' ? ko : en;
    const choices = shuffle([correct, ...distractors]);
    return { direction, en, ko, prompt: direction === 'en2ko' ? en : ko, correct, choices };
  });
}

}
