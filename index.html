<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EngFit 영핏 · Week 4 단어 테스트 🍋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;0,800;0,900;1,700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  button { touch-action: manipulation; }
  :root {
    --lemon: #FFD93D;
    --lemon-deep: #F6BE00;
    --lemon-soft: #FFF1A8;
    --cream: #FFFBEA;
    --ink: #2b2b2b;
    --ink-soft: #6b6450;
    --leaf: #6FB04A;
  }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: var(--cream);
    overflow-x: hidden;
    position: relative;
  }
  .bg-svg {
    position: fixed; top:0; left:0; right:0; bottom:0;
    width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
    opacity: 0.55;
  }
  .bg-overlay {
    position: fixed; top:0; left:0; right:0; bottom:0;
    z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at top, rgba(255,251,234,0.4) 0%, rgba(255,251,234,0.85) 100%);
  }
  .wrap {
    position: relative; z-index: 1;
    max-width: 760px; margin: 0 auto;
    padding: 24px 18px 60px;
  }
  header.brand {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: white;
    border-radius: 22px;
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    margin-bottom: 22px;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo .lemon-mark { width: 44px; height: 44px; flex-shrink: 0; }
  .logo .lemon-mark svg { width: 100%; height: 100%; }
  .logo-text {
    font-family: 'Fraunces', serif;
    font-weight: 900; font-size: 22px;
    color: var(--ink); letter-spacing: -0.5px; line-height: 1;
  }
  .logo-text small {
    display: block;
    font-family: 'Caveat', cursive;
    font-size: 14px; font-weight: 700;
    color: var(--lemon-deep);
    margin-top: 2px; letter-spacing: 0.3px;
  }
  .pill {
    font-family: 'Caveat', cursive;
    font-size: 18px; padding: 6px 14px; border-radius: 999px;
    background: var(--lemon); color: var(--ink); font-weight: 700;
    border: 2.5px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .card {
    background: white;
    border: 3px solid var(--ink);
    border-radius: 26px;
    padding: 32px 26px;
    box-shadow: 6px 6px 0 var(--ink);
    position: relative;
  }
  .card.notebook::before {
    content: '';
    position: absolute;
    top: -3px; left: 30px; right: 30px;
    height: 14px;
    background-image: radial-gradient(circle, var(--cream) 5px, transparent 6px);
    background-size: 28px 14px;
    background-repeat: repeat-x;
    background-position: center;
  }
  .notebook-badge {
    display: inline-block; padding: 8px 22px;
    background: var(--lemon);
    border: 3px solid var(--ink);
    border-radius: 999px;
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 16px; letter-spacing: 3px;
    margin: 0 auto 20px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .start-hero { text-align: center; padding: 18px 0 22px; }
  .start-hero .lemon-big {
    font-size: 64px; line-height: 1;
    display: inline-block;
    animation: wobble 3s ease-in-out infinite;
  }
  @keyframes wobble { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
  .start-hero h1 {
    font-family: 'Fraunces', serif;
    font-size: 34px; font-weight: 900;
    margin-top: 6px;
    color: var(--ink);
    letter-spacing: -1px;
  }
  .start-hero h1 .underline-wave {
    background-image: linear-gradient(transparent 65%, var(--lemon) 65%);
    padding-bottom: 4px;
  }
  .start-hero p {
    color: var(--ink-soft); margin-top: 12px;
    font-family: 'Caveat', cursive;
    font-size: 19px; font-weight: 500;
  }
  .section-label {
    font-family: 'Fraunces', serif;
    font-weight: 800; font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    margin: 18px 0 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::before, .section-label::after {
    content: ''; flex: 1; height: 2px;
    background: repeating-linear-gradient(90deg, var(--ink) 0 4px, transparent 4px 8px);
    opacity: 0.3;
  }
  .part-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 6px; }
  .part-row button.part {
    padding: 12px 6px;
    border: 3px solid var(--ink);
    border-radius: 14px;
    background: white;
    font-family: 'Fraunces', serif;
    font-weight: 800; font-size: 15px;
    color: var(--ink); cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: all 0.15s ease;
  }
  .part-row button.part small {
    display: block;
    font-family: 'Caveat', cursive;
    font-weight: 700; font-size: 12px;
    color: var(--ink-soft); margin-top: 2px;
  }
  @media (hover: hover) {
    .part-row button.part:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  }
  .part-row button.part.active {
    background: var(--lemon);
    transform: translate(1px,1px);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .part-row button.part.active small { color: var(--ink); }
  .opt-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 8px 0 8px; }
  .opt-row.single { grid-template-columns: 1fr; }
  .opt-row button.opt {
    padding: 16px 12px;
    border: 3px solid var(--ink);
    border-radius: 18px;
    background: white;
    font-family: 'Fraunces', serif;
    font-weight: 800; font-size: 17px;
    color: var(--ink); cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .opt-row button.opt small {
    display: block;
    font-family: 'Caveat', cursive;
    font-weight: 700; font-size: 14px;
    color: var(--ink-soft); margin-top: 2px;
  }
  @media (hover: hover) {
    .opt-row button.opt:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  }
  .opt-row button.opt.active {
    background: var(--lemon);
    transform: translate(1px,1px);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .opt-row button.opt.active small { color: var(--ink); }
  .btn-primary {
    display: block; width: 100%; padding: 18px;
    border: 3px solid var(--ink);
    border-radius: 18px;
    background: var(--lemon);
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 900; font-size: 19px;
    cursor: pointer; margin-top: 18px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    letter-spacing: -0.3px;
  }
  @media (hover: hover) {
    .btn-primary:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  }
  .btn-primary:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .btn-ghost {
    display: block; width: 100%; padding: 14px;
    border: 3px solid var(--ink); border-radius: 16px;
    background: white;
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 700; font-size: 16px;
    cursor: pointer; margin-top: 10px;
    box-shadow: 3px 3px 0 var(--ink);
    transition: all 0.12s ease;
  }
  @media (hover: hover) {
    .btn-ghost:hover { background: var(--lemon-soft); transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  }
  .quiz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .progress { flex: 1; height: 14px; background: white; border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; margin-right: 14px; }
  .progress > div { height: 100%; width: 0; background: var(--lemon); transition: width 0.35s ease; }
  .counter {
    font-family: 'Fraunces', serif;
    font-weight: 900; color: var(--ink);
    font-size: 16px; white-space: nowrap;
    background: var(--lemon);
    padding: 4px 12px;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .qmeta {
    display: inline-block; padding: 5px 14px;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    font-family: 'Fraunces', serif;
    font-size: 13px; font-weight: 800;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .qmeta.en { background: #FFE25B; color: var(--ink); }
  .qmeta.ko { background: #FFF1A8; color: var(--ink); }
  .qword {
    font-family: 'Fraunces', serif;
    font-size: 42px; font-weight: 900; line-height: 1.15;
    margin-bottom: 8px; letter-spacing: -1.2px;
    color: var(--ink);
    word-break: keep-all;
  }
  .qhint { color: var(--ink-soft); font-family: 'Caveat', cursive; font-size: 18px; font-weight: 600; margin-bottom: 22px; }
  .kbd-hint { display: none; font-family: 'Caveat', cursive; font-size: 15px; color: var(--ink-soft); margin-top: -10px; margin-bottom: 14px; }
  .kbd-hint kbd { display: inline-block; padding: 1px 7px; background: white; border: 2px solid var(--ink); border-radius: 6px; font-family: 'Fraunces', serif; font-weight: 800; font-size: 13px; box-shadow: 1.5px 1.5px 0 var(--ink); margin: 0 2px; }
  @media (hover: hover) and (min-width: 600px) {
    .kbd-hint { display: block; }
  }
  .choices { display: grid; gap: 12px; }
  .choice {
    text-align: left; padding: 16px 18px;
    border: 3px solid var(--ink);
    border-radius: 16px;
    background: white;
    font-family: 'Pretendard', sans-serif;
    font-size: 16px; font-weight: 700;
    color: var(--ink); cursor: pointer;
    transition: all 0.12s ease;
    display: flex; align-items: center; gap: 12px;
    word-break: keep-all;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .choice .badge {
    width: 30px; height: 30px; border-radius: 999px;
    background: var(--lemon);
    border: 2.5px solid var(--ink);
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 900; font-size: 14px;
    display: grid; place-items: center; flex-shrink: 0;
  }
  @media (hover: hover) {
    .choice:hover:not(:disabled) { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); background: var(--lemon-soft); }
  }
  .choice.correct { background: #C7EFB0; border-color: var(--ink); }
  .choice.correct .badge { background: var(--leaf); color: white; }
  .choice.wrong { background: #FFC7C7; border-color: var(--ink); }
  .choice.wrong .badge { background: #E85A5A; color: white; }
  .choice:disabled { cursor: default; }
  .feedback {
    margin-top: 16px; padding: 14px 16px;
    border: 3px solid var(--ink);
    border-radius: 14px;
    font-family: 'Fraunces', serif;
    font-size: 16px; font-weight: 800;
    display: none;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .feedback.show { display: block; }
  .feedback.ok { background: #C7EFB0; color: #2d5a16; }
  .feedback.no { background: #FFC7C7; color: #8a1a1a; }
  .result-hero { text-align: center; padding: 8px 0 18px; }
  .result-hero .big-emoji { font-size: 72px; animation: wobble 2.5s ease-in-out infinite; display: inline-block; }
  .result-hero h2 { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 900; margin-top: 8px; letter-spacing: -0.8px; color: var(--ink); }
  .result-score {
    margin: 18px auto 8px;
    font-family: 'Fraunces', serif;
    font-size: 76px; font-weight: 900;
    color: var(--ink); line-height: 1;
    display: inline-block; position: relative;
  }
  .result-score::after {
    content: '';
    position: absolute; left: -8px; right: -8px;
    bottom: 4px; height: 16px;
    background: var(--lemon);
    z-index: -1; border-radius: 8px;
  }
  .result-sub { color: var(--ink-soft); font-family: 'Caveat', cursive; font-size: 20px; font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 26px 0; }
  .stat { background: white; padding: 14px 8px; border-radius: 16px; text-align: center; border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .stat .num { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 900; color: var(--ink); }
  .stat .lbl { font-family: 'Caveat', cursive; font-size: 16px; font-weight: 700; color: var(--ink-soft); margin-top: 2px; }
  .stat.ok { background: #C7EFB0; }
  .stat.no { background: #FFC7C7; }
  .wrong-section h3 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 12px; }
  .wrong-list { background: var(--cream); border: 3px dashed var(--ink); border-radius: 16px; padding: 14px; max-height: 280px; overflow-y: auto; font-size: 15px; }
  .wrong-list .item { padding: 10px 0; border-bottom: 2px dashed rgba(0,0,0,0.12); }
  .wrong-list .item:last-child { border-bottom: none; }
  .wrong-list .en { font-family: 'Fraunces', serif; font-weight: 800; color: var(--ink); }
  .wrong-list .ko { color: var(--ink-soft); font-weight: 500; }
  .wrong-list .mine { color: #c44747; font-family: 'Caveat', cursive; font-size: 15px; font-weight: 700; margin-top: 2px; }
  .perfect { background: var(--lemon); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 20px; border-radius: 16px; text-align: center; font-family: 'Fraunces', serif; font-weight: 900; color: var(--ink); font-size: 17px; }
  .copy-btn {
    margin-top: 14px; width: 100%; padding: 16px;
    background: #FAE100;
    border: 3px solid var(--ink); border-radius: 16px;
    color: var(--ink);
    font-family: 'Fraunces', serif; font-weight: 900; font-size: 16px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.12s ease;
  }
  @media (hover: hover) {
    .copy-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  }
  .copy-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .copy-btn.copied { background: #C7EFB0; }
  .kakao-icon { width: 22px; height: 22px; }
  .restart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .restart-row button {
    padding: 14px;
    border: 3px solid var(--ink); border-radius: 14px;
    font-family: 'Fraunces', serif;
    font-weight: 800; font-size: 15px; cursor: pointer;
    background: white; color: var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    transition: all 0.12s ease;
  }
  .restart-row button.primary { background: var(--lemon); }
  footer.foot { text-align: center; color: var(--ink-soft); font-family: 'Caveat', cursive; font-size: 17px; font-weight: 700; margin-top: 24px; }
  footer.foot b { color: var(--ink); }
  #searchBox {
    width: 100%; padding: 14px 16px;
    border-radius: 14px;
    border: 3px solid var(--ink);
    background: white;
    font-family: inherit; font-size: 15px;
    margin-bottom: 14px; outline: none;
    box-shadow: 3px 3px 0 var(--ink);
    font-weight: 600;
  }
  .vocab-item { padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; background: white; border: 2.5px solid var(--ink); display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 2px 2px 0 var(--ink); }
  .vocab-item .v-en { font-family: 'Fraunces', serif; font-weight: 800; color: var(--ink); }
  .vocab-item .v-ko { color: var(--ink-soft); font-size: 14px; text-align: right; font-weight: 500; }
  @media (max-width: 480px) {
    .qword { font-size: 32px; }
    .start-hero h1 { font-size: 26px; }
    .result-score { font-size: 56px; }
    .card { padding: 26px 20px; border-radius: 22px; }
    .logo-text { font-size: 18px; }
    .logo .lemon-mark { width: 38px; height: 38px; }
  }
</style>
</head>
<body>
<svg class="bg-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <pattern id="lemonPattern" x="0" y="0" width="360" height="360" patternUnits="userSpaceOnUse">
      <rect width="360" height="360" fill="#FFFBEA"/>
      <g transform="translate(60,70) rotate(-15)">
        <circle cx="0" cy="0" r="55" fill="#FFEB7A" stroke="#F6BE00" stroke-width="3"/>
        <circle cx="0" cy="0" r="42" fill="#FFF5C2" stroke="#F6BE00" stroke-width="2"/>
        <g stroke="#F6BE00" stroke-width="2" fill="none">
          <line x1="0" y1="-40" x2="0" y2="40"/>
          <line x1="-40" y1="0" x2="40" y2="0"/>
          <line x1="-28" y1="-28" x2="28" y2="28"/>
          <line x1="-28" y1="28" x2="28" y2="-28"/>
        </g>
      </g>
      <g transform="translate(310,40) rotate(25)">
        <circle cx="0" cy="0" r="48" fill="#FFE25B" stroke="#F6BE00" stroke-width="3"/>
        <circle cx="0" cy="0" r="36" fill="#FFF5C2" stroke="#F6BE00" stroke-width="2"/>
        <g stroke="#F6BE00" stroke-width="2" fill="none">
          <line x1="0" y1="-34" x2="0" y2="34"/>
          <line x1="-34" y1="0" x2="34" y2="0"/>
          <line x1="-24" y1="-24" x2="24" y2="24"/>
          <line x1="-24" y1="24" x2="24" y2="-24"/>
        </g>
      </g>
      <g transform="translate(190,180) rotate(20)">
        <ellipse cx="0" cy="0" rx="48" ry="38" fill="#FFD93D" stroke="#E5A800" stroke-width="3"/>
        <path d="M 40 -25 Q 50 -38 65 -30" stroke="#6FB04A" stroke-width="3" fill="#80C055" stroke-linejoin="round"/>
      </g>
      <g transform="translate(50,280) rotate(35)">
        <circle cx="0" cy="0" r="50" fill="#FFEB7A" stroke="#F6BE00" stroke-width="3"/>
        <circle cx="0" cy="0" r="38" fill="#FFF5C2" stroke="#F6BE00" stroke-width="2"/>
        <g stroke="#F6BE00" stroke-width="2" fill="none">
          <line x1="0" y1="-36" x2="0" y2="36"/>
          <line x1="-36" y1="0" x2="36" y2="0"/>
          <line x1="-25" y1="-25" x2="25" y2="25"/>
          <line x1="-25" y1="25" x2="25" y2="-25"/>
        </g>
      </g>
      <g transform="translate(310,310) rotate(-10)">
        <circle cx="0" cy="0" r="52" fill="#FFE25B" stroke="#F6BE00" stroke-width="3"/>
        <circle cx="0" cy="0" r="40" fill="#FFF5C2" stroke="#F6BE00" stroke-width="2"/>
        <g stroke="#F6BE00" stroke-width="2" fill="none">
          <line x1="0" y1="-38" x2="0" y2="38"/>
          <line x1="-38" y1="0" x2="38" y2="0"/>
        </g>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#lemonPattern)"/>
</svg>
<div class="bg-overlay"></div>
<div class="wrap">
  <header class="brand">
    <div class="logo">
      <div class="lemon-mark">
        <svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
          <circle cx="25" cy="25" r="22" fill="#FFEB7A" stroke="#2b2b2b" stroke-width="2.5"/>
          <circle cx="25" cy="25" r="16" fill="#FFF5C2" stroke="#2b2b2b" stroke-width="2"/>
          <g stroke="#2b2b2b" stroke-width="1.8" fill="none">
            <line x1="25" y1="10" x2="25" y2="40"/>
            <line x1="10" y1="25" x2="40" y2="25"/>
            <line x1="14" y1="14" x2="36" y2="36"/>
            <line x1="14" y1="36" x2="36" y2="14"/>
          </g>
        </svg>
      </div>
      <div class="logo-text">
        EngFit 영핏
        <small>~ vocab notebook ~</small>
      </div>
    </div>
    <span class="pill">지나 티처 🍋</span>
  </header>

  <section id="start" class="card notebook">
    <div class="start-hero">
      <div style="margin-bottom:8px"><span class="notebook-badge">NOTEBOOK</span></div>
      <div class="lemon-big">🍋</div>
      <h1><span class="underline-wave">Week 4 단어</span> 테스트</h1>
      <p>새콤달콤 오늘의 단어 한 입! 영↔한 섞어서 출제돼요.</p>
    </div>
    <div class="section-label">PART 선택</div>
    <div class="part-row" id="partRow">
      <button class="part active" data-part="1">Part 1<small>1~132번</small></button>
      <button class="part" data-part="2">Part 2<small>133~264번</small></button>
      <button class="part" data-part="3">Part 3<small>265~395번</small></button>
      <button class="part" data-part="4">Part 4<small>396~526번</small></button>
    </div>
    <button class="btn-primary" id="startBtn">Part 전체 시작하기 🏆</button>
    <button class="btn-ghost" id="lookupBtn">단어장 펼쳐보기 📖</button>
  </section>

  <section id="lookup" class="card" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="font-family:'Fraunces',serif;font-size:22px;font-weight:900;color:var(--ink)">📖 단어장</h2>
      <button class="pill" id="backFromLookup" style="cursor:pointer">← back</button>
    </div>
    <input id="searchBox" placeholder="🔍 영어 / 한글 검색...">
    <div id="vocabList" style="max-height:60vh;overflow-y:auto;padding-right:6px"></div>
  </section>

  <section id="quiz" class="card" style="display:none">
    <div class="quiz-top">
      <div class="progress"><div id="bar"></div></div>
      <div class="counter" id="counter">1 / 20</div>
    </div>
    <div class="qmeta" id="qmeta">영어 → 한국어</div>
    <div class="qword" id="qword">word</div>
    <div class="qhint" id="qhint">다음 단어의 뜻으로 알맞은 것은?</div>
    <div class="kbd-hint">💡 키보드 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 로도 선택 가능해요</div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <section id="result" class="card notebook" style="display:none">
    <div class="result-hero">
      <div class="big-emoji" id="rEmoji">🍋</div>
      <h2 id="rTitle">테스트 완료!</h2>
      <div><span class="result-score"><span id="rScore">0</span>점</span></div>
      <div class="result-sub" id="rSub">잘 했어요!</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" id="sTotal">0</div><div class="lbl">전체</div></div>
      <div class="stat ok"><div class="num" id="sOk">0</div><div class="lbl">맞음</div></div>
      <div class="stat no"><div class="num" id="sNo">0</div><div class="lbl">틀림</div></div>
    </div>
    <div class="wrong-section">
      <h3>📝 틀린 단어</h3>
      <div id="wrongBox"></div>
      <button class="copy-btn" id="copyBtn">
        <svg class="kakao-icon" viewBox="0 0 24 24" fill="#2b2b2b"><path d="M12 3C6.5 3 2 6.5 2 10.7c0 2.7 1.8 5 4.5 6.3L5.4 21l4.3-2.5c.7.1 1.5.2 2.3.2 5.5 0 10-3.5 10-7.7S17.5 3 12 3z"/></svg>
        지나 티처에게 보낼 메시지 복사
      </button>
    </div>
    <div class="restart-row">
      <button id="reviewBtn">틀린 단어 다시</button>
      <button class="primary" id="restartBtn">처음으로 🍋</button>
    </div>
  </section>

  <footer class="foot">
    Made with 🍋 by <b>EngFit 영핏</b> · 지나 티처
  </footer>
</div>

<script src="vocab.js"></script>
<script>
const shuffle = (a) => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (arr, n, exclude) => {
  const pool = arr.filter(x => x !== exclude);
  return shuffle(pool.slice()).slice(0, n);
};

let state = { questions: [], current: 0, wrong: [], answered: false, partLabel: 'Part 1' };
let selectedCount = 'all';
let selectedPart = 1;

// Split VOCAB into 4 parts (~132 each)
function getPartVocab(part) {
  const total = VOCAB.length;
  const perPart = Math.ceil(total / 4);
  const start = (part - 1) * perPart;
  const end = Math.min(start + perPart, total);
  return VOCAB.slice(start, end);
}

function buildQuestions(count) {
  const partVocab = getPartVocab(selectedPart);
  const pool = shuffle(partVocab.slice()).slice(0, count === 'all' ? partVocab.length : Math.min(count, partVocab.length));
  return pool.map(function(item) {
    const en = item[0], ko = item[1];
    const direction = Math.random() < 0.5 ? 'en2ko' : 'ko2en';
    const distractors = sample(VOCAB, 3, item).map(function(x) {
      return direction === 'en2ko' ? x[1] : x[0];
    });
    const correct = direction === 'en2ko' ? ko : en;
    const choices = shuffle([correct].concat(distractors));
    return { direction: direction, en: en, ko: ko, prompt: direction === 'en2ko' ? en : ko, correct: correct, choices: choices };
  });
}

function $(id) { return document.getElementById(id); }

function show(screen) {
  ['start','quiz','result','lookup'].forEach(function(s) {
    $(s).style.display = s === screen ? '' : 'none';
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion() {
  const q = state.questions[state.current];
  $('counter').textContent = state.partLabel + ' · ' + (state.current+1) + '/' + state.questions.length;
  $('bar').style.width = ((state.current/state.questions.length)*100) + '%';
  $('qmeta').textContent = q.direction === 'en2ko' ? '영어 → 한국어' : '한국어 → 영어';
  $('qmeta').className = 'qmeta ' + (q.direction === 'en2ko' ? 'en' : 'ko');
  $('qword').textContent = q.prompt;
  $('qhint').textContent = q.direction === 'en2ko' ? '다음 영어 단어의 뜻으로 알맞은 것은?' : '다음 뜻에 해당하는 영어 단어는?';
  const choicesEl = $('choices');
  choicesEl.innerHTML = '';
  const labels = ['①','②','③','④'];
  q.choices.forEach(function(c, i) {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = '<span class="badge">' + labels[i] + '</span><span>' + c + '</span>';
    btn.addEventListener('click', function() { handleAnswer(btn, c, q); });
    choicesEl.appendChild(btn);
  });
  $('feedback').className = 'feedback';
  $('feedback').textContent = '';
  state.answered = false;
}

function handleAnswer(btn, choice, q) {
  if (state.answered) return;
  state.answered = true;
  const isCorrect = choice === q.correct;
  const allBtns = $('choices').querySelectorAll('.choice');
  allBtns.forEach(function(b) {
    b.disabled = true;
    const txt = b.querySelector('span:last-child').textContent;
    if (txt === q.correct) b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
  });
  const fb = $('feedback');
  if (isCorrect) {
    fb.className = 'feedback show ok';
    fb.textContent = '🍋 정답이에요!';
  } else {
    fb.className = 'feedback show no';
    fb.textContent = '❌ 정답: ' + q.correct;
    state.wrong.push(Object.assign({}, q, { mine: choice }));
  }
  // Auto-advance after 0.5s (longer if wrong so user can see the answer)
  setTimeout(nextQuestion, isCorrect ? 500 : 1200);
}

function nextQuestion() {
  state.current++;
  if (state.current >= state.questions.length) showResult();
  else renderQuestion();
}

function showResult() {
  const total = state.questions.length;
  const ok = total - state.wrong.length;
  const pct = Math.round((ok/total)*100);
  $('rScore').textContent = pct;
  $('sTotal').textContent = total;
  $('sOk').textContent = ok;
  $('sNo').textContent = state.wrong.length;

  let emoji = '🏆', title = '완벽해요!', sub = '모든 단어를 맞혔어요!';
  if (pct < 100 && pct >= 80) { emoji = '🍋'; title = '잘 했어요!'; sub = '거의 다 맞혔어요!'; }
  else if (pct >= 60) { emoji = '💪'; title = '괜찮아요!'; sub = '조금만 더 복습해 봐요!'; }
  else if (pct >= 40) { emoji = '📖'; title = '복습이 필요해요'; sub = '틀린 단어 꼭 보고 가요!'; }
  else if (pct < 40) { emoji = '🌱'; title = '다시 도전!'; sub = '단어장을 보며 천천히 익혀봐요!'; }
  $('rEmoji').textContent = emoji;
  $('rTitle').textContent = state.partLabel + ' ' + title;
  $('rSub').textContent = sub;

  const wrongBox = $('wrongBox');
  if (state.wrong.length === 0) {
    wrongBox.innerHTML = '<div class="perfect">🏆 100점! 틀린 단어가 없어요!</div>';
    $('copyBtn').style.display = 'none';
  } else {
    let html = '<div class="wrong-list">';
    state.wrong.forEach(function(w) {
      html += '<div class="item"><span class="en">' + w.en + '</span> <span class="ko">— ' + w.ko + '</span><div class="mine">내 답: ' + w.mine + '</div></div>';
    });
    html += '</div>';
    wrongBox.innerHTML = html;
    $('copyBtn').style.display = '';
  }
  show('result');
}

function buildKakaoMessage() {
  const date = new Date();
  const y = date.getFullYear(), m = date.getMonth()+1, d = date.getDate();
  let msg = '🍋 EngFit 영핏 단어 테스트 결과\n';
  msg += '📅 ' + y + '.' + String(m).padStart(2,'0') + '.' + String(d).padStart(2,'0') + '\n';
  msg += '📚 ' + state.partLabel + '\n';
  msg += '\n✅ ' + state.questions.length + '문항 중 ' + (state.questions.length - state.wrong.length) + '개 정답';
  msg += ' (' + Math.round(((state.questions.length-state.wrong.length)/state.questions.length)*100) + '점)\n';
  if (state.wrong.length > 0) {
    msg += '\n❌ 틀린 단어 (' + state.wrong.length + '개)\n';
    msg += '―――――――――――\n';
    state.wrong.forEach(function(w, i) {
      msg += (i+1) + '. ' + w.en + ' → ' + w.ko + '\n   (내 답: ' + w.mine + ')\n';
    });
  } else {
    msg += '\n🏆 모두 정답! 완벽해요!';
  }
  msg += '\n지나 티처 🍋';
  return msg;
}

function copyKakao() {
  const msg = buildKakaoMessage();
  const btn = $('copyBtn');
  function done() {
    btn.classList.add('copied');
    btn.innerHTML = '✅ 복사 완료!';
    setTimeout(function() {
      btn.classList.remove('copied');
      btn.innerHTML = '<svg class="kakao-icon" viewBox="0 0 24 24" fill="#2b2b2b"><path d="M12 3C6.5 3 2 6.5 2 10.7c0 2.7 1.8 5 4.5 6.3L5.4 21l4.3-2.5c.7.1 1.5.2 2.3.2 5.5 0 10-3.5 10-7.7S17.5 3 12 3z"/></svg> 지나 티처에게 보낼 메시지 복사';
    }, 2400);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(msg).then(done).catch(function() {
      const ta = document.createElement('textarea');
      ta.value = msg; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
      done();
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = msg; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    done();
  }
}

function renderVocabList(filter) {
  filter = (filter || '').trim().toLowerCase();
  const list = VOCAB.filter(function(item) {
    return !filter || item[0].toLowerCase().indexOf(filter) >= 0 || item[1].toLowerCase().indexOf(filter) >= 0;
  });
  const el = $('vocabList');
  if (list.length === 0) {
    el.innerHTML = '<div style="text-align:center;color:var(--ink-soft);padding:30px;font-family:Caveat,cursive;font-size:18px">검색 결과가 없어요 🍋</div>';
    return;
  }
  el.innerHTML = list.map(function(item) {
    return '<div class="vocab-item"><span class="v-en">' + item[0] + '</span><span class="v-ko">' + item[1] + '</span></div>';
  }).join('');
}

// === Bind events ===
document.addEventListener('DOMContentLoaded', function() {
  // Part selector
  const parts = document.querySelectorAll('#partRow .part');
  parts.forEach(function(b) {
    b.addEventListener('click', function() {
      parts.forEach(function(x) { x.classList.remove('active'); });
      b.classList.add('active');
      selectedPart = parseInt(b.dataset.part, 10);
    });
  });

  $('startBtn').addEventListener('click', function() {
    state.partLabel = 'Part ' + selectedPart;
    state.questions = buildQuestions(selectedCount);
    state.current = 0; state.wrong = [];
    show('quiz'); renderQuestion();
  });
  $('copyBtn').addEventListener('click', copyKakao);
  $('restartBtn').addEventListener('click', function() { show('start'); });
  $('reviewBtn').addEventListener('click', function() {
    if (state.wrong.length === 0) { show('start'); return; }
    const wrongVocab = state.wrong.map(function(w) { return [w.en, w.ko]; });
    state.questions = shuffle(wrongVocab.slice()).map(function(item) {
      const en = item[0], ko = item[1];
      const direction = Math.random() < 0.5 ? 'en2ko' : 'ko2en';
      const distractors = sample(VOCAB, 3, [en, ko]).map(function(x) {
        return direction === 'en2ko' ? x[1] : x[0];
      });
      const correct = direction === 'en2ko' ? ko : en;
      return { direction: direction, en: en, ko: ko, prompt: direction === 'en2ko' ? en : ko, correct: correct, choices: shuffle([correct].concat(distractors)) };
    });
    state.current = 0; state.wrong = [];
    show('quiz'); renderQuestion();
  });
  $('lookupBtn').addEventListener('click', function() { renderVocabList(); show('lookup'); });
  $('backFromLookup').addEventListener('click', function() { show('start'); });
  $('searchBox').addEventListener('input', function(e) { renderVocabList(e.target.value); });

  // Keyboard shortcuts: 1-4 keys select choices on the quiz screen
  document.addEventListener('keydown', function(e) {
    // Skip if user is typing in search box etc.
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    // Only when quiz screen is visible
    if ($('quiz').style.display === 'none') return;
    if (state.answered) return;
    const key = e.key;
    const idx = ['1','2','3','4'].indexOf(key);
    if (idx === -1) return;
    const buttons = $('choices').querySelectorAll('.choice');
    if (buttons[idx]) {
      e.preventDefault();
      buttons[idx].click();
    }
  });

  show('start');
});
</script>
</body>
</html>
